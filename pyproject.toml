[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapbiomas-local"
version = "0.1.0"
description = "Local reimplementation of the MapBiomas Collection 11 deforestation and secondary vegetation temporal rules"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Felipe Ferreira" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "tqdm>=4.60",
]

[project.optional-dependencies]
filter = ["opencv-python-headless>=4.8"]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=7.0"]

[project.scripts]
mapbiomas-local = "mapbiomas_local.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
